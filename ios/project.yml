name: LeadFinder

options:
  bundleIdPrefix: art.lukashahn
  deploymentTarget:
    iOS: "18.0"
    macOS: "14.0"
  createIntermediateGroups: true
  developmentLanguage: en

# Secrets.xcconfig is git-ignored and holds MOBILE_API_SECRET. It is optional:
# without it the app compiles but shows the "not configured" setup screen.
# Secrets.example.xcconfig is the committed template.
configFiles:
  Debug: Config/Base.xcconfig
  Release: Config/Base.xcconfig

settings:
  base:
    SWIFT_VERSION: "6.0"
    IPHONEOS_DEPLOYMENT_TARGET: "18.0"
    TARGETED_DEVICE_FAMILY: "1"
    ENABLE_USER_SCRIPT_SANDBOXING: YES
    SWIFT_STRICT_CONCURRENCY: complete
    CODE_SIGN_STYLE: Automatic
    # Lukas's free "Personal Team". Not the RKS242Y24L certificates that are in
    # the keychain: those belong to a different team and Xcode has no account for
    # either, so signing needs the Apple ID added in Xcode ▸ Settings ▸ Accounts.
    DEVELOPMENT_TEAM: 8AK8X62ARR
    # Personal Team provisioning: the app is re-signed every 7 days.
    CODE_SIGN_IDENTITY: "Apple Development"

targets:
  LeadFinder:
    type: application
    platform: iOS
    sources:
      - path: LeadFinder
    dependencies:
      - target: CallerID
    info:
      path: LeadFinder/Resources/Info.plist
      properties:
        CFBundleDisplayName: LeadFinder
        UILaunchScreen:
          UIColorName: LaunchBackground
        UIUserInterfaceStyle: Dark
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
        ITSAppUsesNonExemptEncryption: false
        # Xcode expands $(VAR) in Info.plist from the build settings, which come
        # from Config/Base.xcconfig and the git-ignored Secrets.xcconfig. Left
        # unexpanded when the secret is missing, which AppConfig detects.
        MOBILE_API_BASE_URL: $(MOBILE_API_BASE_URL)
        MOBILE_API_SECRET: $(MOBILE_API_SECRET)
        # Lets a Debug build talk to `next dev` on the Mac's own localhost.
        # Localhost only, so the production API still has to be HTTPS.
        NSAppTransportSecurity:
          NSAllowsLocalNetworking: true
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: art.lukashahn.LeadFinder

  # The Mac app. Same Swift files as the iPhone app (API, Store, Design,
  # Features) plus `Mac/`, which holds the window chrome and the NSSharingService
  # message composer. Anything iOS-only — UIKit, MessageUI, PhotosUI, Call
  # Directory — sits behind `#if os(iOS)` or in a platform folder.
  LeadFinderMac:
    type: application
    platform: macOS
    sources:
      - path: LeadFinder
      - path: Mac
    info:
      path: Mac/Info.plist
      properties:
        CFBundleDisplayName: LeadFinder
        LSMinimumSystemVersion: $(MACOSX_DEPLOYMENT_TARGET)
        ITSAppUsesNonExemptEncryption: false
        # Same keys the iPhone app reads, filled in from the same xcconfig.
        MOBILE_API_BASE_URL: $(MOBILE_API_BASE_URL)
        MOBILE_API_SECRET: $(MOBILE_API_SECRET)
        NSAppTransportSecurity:
          NSAllowsLocalNetworking: true
        NSHumanReadableCopyright: ""
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: art.lukashahn.LeadFinderMac
        TARGETED_DEVICE_FAMILY: "2"
        # Ad-hoc: the Mac app isn't sandboxed and has no capabilities that need
        # a provisioning profile, so it signs and runs locally without one.
        CODE_SIGN_IDENTITY: "-"
        CODE_SIGN_STYLE: Manual
        DEVELOPMENT_TEAM: ""

  # Call Directory extension: labels incoming calls from agents. Switched on
  # once in Settings › Apps › Phone › Call Blocking & Identification.
  CallerID:
    type: app-extension
    platform: iOS
    sources:
      - path: CallerID
      - path: LeadFinder/App/AppConfig.swift
      - path: LeadFinder/API/CallerIDTable.swift
    info:
      path: CallerID/Info.plist
      properties:
        CFBundleDisplayName: LeadFinder
        MOBILE_API_BASE_URL: $(MOBILE_API_BASE_URL)
        MOBILE_API_SECRET: $(MOBILE_API_SECRET)
        NSExtension:
          NSExtensionPointIdentifier: com.apple.callkit.call-directory
          NSExtensionPrincipalClass: $(PRODUCT_MODULE_NAME).CallDirectoryHandler
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: art.lukashahn.LeadFinder.CallerID
